name: JJ Android parallel range verification
on:
  push:
    branches:
      - jj/android-parallel-upstream-20261024
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jj-android-parallel-upstream-verification
  cancel-in-progress: false
jobs:
  android-range-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Clone without inherited malformed submodule checkout
        shell: bash
        run: |
          git clone --quiet --depth 1 --filter=blob:none --single-branch \
            --branch jj/android-parallel-upstream-20261024 \
            https://github.com/jaskaransingh11/NuvioMobile.git .
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Configure upstream public cloud client (no private secrets)
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/NuvioMedia/self-host/39ea2bd1bc71636127f9d797599c23b4236960c4/.env.example -o nuvio-official-public.env
          url="$(sed -n 's/^NUVIO_CLOUD_URL=//p' nuvio-official-public.env | head -n 1)"
          key="$(sed -n 's/^NUVIO_CLOUD_PUBLISHABLE_KEY=//p' nuvio-official-public.env | head -n 1)"
          test "$url" = "https://api.nuvio.tv"
          [[ "$key" =~ ^sb_publishable_[A-Za-z0-9_-]{20,200}$ ]] || exit 1
          printf 'NUVIO_SUPABASE_URL=%s\n' "$url" >> "$GITHUB_ENV"
          printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "$key" >> "$GITHUB_ENV"
          touch local.properties
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Host-side download regression tests
        run: |
          ./gradlew :composeApp:testAndroidHostTest \
            --tests '*AndroidMultiRangeTransferTest' \
            --tests '*AndroidDownloadTransferTest' \
            --tests '*DownloadsTransferWorkerTest' \
            -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore \
            --no-daemon --max-workers=2 --stacktrace
      - name: Build Android debug APK
        run: |
          ./gradlew :androidApp:assembleFullDebug \
            -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore \
            --no-daemon --max-workers=2 --stacktrace
      - name: Upload test APK (unverified on device)
        uses: actions/upload-artifact@v4
        with:
          name: jj-nuvio-android-parallel-debug
          path: androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          if-no-files-found: error
          retention-days: 5
